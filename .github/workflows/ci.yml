name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast job: no project install, so it reports in seconds.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff check
        run: uvx --from ruff==0.16.10 ruff check .
      - name: ruff format
        run: uvx --from ruff==0.16.10 ruff format --check .

  # Slow job: installs the project (torch is ~1 GB) and runs both test tiers.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --python 3.13
      - name: Cache the HF model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-Qwen2.5-0.5B-Instruct
      - name: Unit tests (stubs + tiny model, no download)
        run: uv run pytest -q -m "not slow"
      - name: Correctness against HF generate (downloads ~1 GB, CPU is slow)
        run: uv run pytest -q -m slow
